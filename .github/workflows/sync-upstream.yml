
name: Sync from upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream safely
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Saltsh1345/vector-site.git
          git fetch upstream main

          git merge --no-commit --no-ff upstream/main || true

          # Use the current upstream Vercel configuration
          git show upstream/main:vercel.json > vercel.json
          git add vercel.json

          # Check for unresolved merge conflicts
          unresolved="$(git diff --name-only --diff-filter=U)"

          if [ -n "$unresolved" ]; then
            echo "Other conflicts require manual resolution:"
            echo "$unresolved"
            exit 1
          fi

          # Create merge commit if needed
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Merge upstream main"
          else
            echo "Already up to date."
          fi

          # Push synchronized main branch
          git push origin HEAD:main
